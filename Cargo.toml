[workspace]
resolver = "2"
members = [
    "crates/companion-core",
    "crates/companion-providers",
    "crates/companion-proxy",
    "crates/companion-ui",
    "crates/companion-cli",
]

[workspace.package]
version = "0.2.0-dev.4"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Jacksunwei/agy-companion"

[workspace.dependencies]
axum = "0.8"
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
companion-core = { path = "crates/companion-core" }
companion-providers = { path = "crates/companion-providers" }
companion-proxy = { path = "crates/companion-proxy" }
companion-ui = { path = "crates/companion-ui" }
dirs = "7"
futures-util = "0.3"
getrandom = "0.4"
http = "1"
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json", "http2"] }
ring = "0.17"
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = "symbols"
