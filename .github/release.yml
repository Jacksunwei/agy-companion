changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Breaking Changes
      labels:
        - breaking
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Bug Fixes
      labels:
        - bug
        - fix
    - title: Security & Supply Chain
      labels:
        - security
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: Maintenance & CI
      labels:
        - dependencies
        - ci
        - chore
    - title: Other Changes
      labels:
        - "*"
