name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  agent-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and verify committed UI single-file bundle
        run: |
          npm --prefix ui ci
          npm --prefix ui run typecheck
          npm --prefix ui run build
          git diff --exit-code -- ui/dist/index.html
      - name: Validate plugin and npm JSON manifests
        run: |
          node -e '
            const fs = require("fs");
            for (const p of [
              "plugin/plugin.json",
              "plugin/mcp_config.json",
              "plugin/sidecars/proxy/sidecar.json",
              "packages/npm/agy-companion/package.json",
            ]) {
              JSON.parse(fs.readFileSync(p, "utf8"));
            }
            console.log("All 4 plugin & npm JSON manifests parsed cleanly.");
          '
      # Runs all 7 verification gates:
      #   [1/7] Antigravity-native governance files (no GEMINI.md)
      #   [2/7] Tracked file hygiene (incl. __pycache__/*.pyc) & Google API key secret scan (tracked, staged, commits)
      #   [3/7] Zero AI attribution in commits
      #   [4/7] Shell syntax (bash -n & /bin/bash -n), executable bit (-x) on scripts/*.sh + plugin/scripts/*.sh, and dev-install safety
      #   [5/7] 4-way version sync (Cargo.toml, plugin.json, npm package.json + 5 optionalDeps, pyproject.toml), JS/Python shim checks, e2e/*.py py_compile & e2e/run_e2e.py --self-test
      #   [6/7] Rust workspace (fmt, clippy -D warnings, cargo test) & UI XSS hygiene / single-file bundle gate (< 512000 bytes)
      #   [7/7] Plugin JSON manifests & agy plugin validate --strict ./plugin (clean skip if agy absent)
      - name: Verify E2E harness syntax and self-tests (zero __pycache__)
        run: |
          python3 -B -c '
          import os, pathlib, py_compile, tempfile
          with tempfile.TemporaryDirectory() as td:
              for idx, f in enumerate(sorted(pathlib.Path("e2e").glob("*.py"))):
                  py_compile.compile(str(f), cfile=os.path.join(td, f"e2e_{idx}.pyc"), doraise=True)
          '
          python3 -B e2e/run_e2e.py --self-test -v
      - name: Run agent verification gate
        run: ./scripts/agent_check.sh
