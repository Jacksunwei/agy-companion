name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  agent-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Run agent verification gate
        run: ./scripts/agent_check.sh
